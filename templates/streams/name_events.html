<section class="app-panel">
    <div class="panel-head">
        <div class="panel-title-group">
            <h2 class="panel-title">Events</h2>
            <button
                class="btn btn-sm btn-outline-secondary"
                hx-get="/streams/{{ .StreamName }}/events"
                hx-target="#events-panel"
                hx-swap="innerHTML"
                title="Refresh events"
                aria-label="Refresh events">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
        <div class="panel-meta">
            <span id="event-num">{{ len .Events }}</span>
            <span>event(s)</span>
        </div>
    </div>

    <div class="event-table-wrap">
        <table class="app-table">
            <thead>
                <tr>
                    <th style="width: 210px;">Timestamp</th>
                    <th style="width: 180px;">ID</th>
                    <th style="width: 130px;">Ack</th>
                    {{ range .Table.Headers }}
                    <th>{{ . }}</th>
                    {{ end }}
                    <th style="width: 90px;"></th>
                </tr>
            </thead>
            <tbody>
                {{ range .Table.Rows }}
                <tr>
                    {{ $row := . }}
                    <td class="ts muted">{{ .Timestamp }}</td>
                    <td class="id"><code>{{ .ID }}</code></td>
                    <td class="ack-cell">
                        <span
                            class="ack-pill {{ .AckState }}"
                            tabindex="0"
                            data-bs-toggle="tooltip"
                            data-bs-placement="left"
                            data-bs-container="body"
                            data-bs-custom-class="ack-tooltip"
                            data-bs-title="{{ .AckTooltip }}">{{ .AckLabel }}</span>
                    </td>
                    {{ range $.Table.Headers }}
                    <td class="values"><pre class="json">{{ index $row.Values . }}</pre></td>
                    {{ end }}
                    <td>
                        <div class="event-row-actions">
                        <button
                            class="btn btn-sm btn-outline-danger"
                            hx-delete="/api/v1/streams/{{ $.StreamName }}/events/{{ .ID }}"
                            hx-target="closest tr"
                            hx-swap="outerHTML"
                            hx-confirm="Delete event '{{ .ID }}' ?"
                            hx-on="htmx:afterRequest: window.handleEventDeleted && window.handleEventDeleted(event)"
                            title="Delete event"
                            aria-label="Delete event {{ .ID }}">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        </div>
                    </td>
                </tr>
                {{ else }}
                <tr>
                    <td colspan="999" class="empty-state">
                        No events found
                    </td>
                </tr>
                {{ end }}
            </tbody>
        </table>
    </div>
</section>
